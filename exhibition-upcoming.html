<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="images/daa-Logo-red.png">

    <!-- GOOGLE ANALYTICS KODU BAŞLANGICI -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-6EB0M3KD2R"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-6EB0M3KD2R');
    </script> 
    <!-- GOOGLE ANALYTICS KODU BİTİŞİ -->

    <!-- SEO META TAGS -->
    <title>Upcoming Solo Exhibition | Dilara Altınkepçe Arslan</title>
    <meta name="description" content="Announcement of Dilara Altınkepçe Arslan's second solo exhibition. Curated by Nil Nuhoğlu with exhibition design by Aygen İncel.">
    <meta name="keywords" content="Dilara Altınkepçe Arslan, second solo exhibition, Nil Nuhoğlu, Aygen İncel, contemporary art Istanbul">
    <meta name="author" content="Dilara Altınkepçe Arslan">

    <!-- SOSYAL MEDYA PAYLAŞIM KARTI -->
    <meta property="og:title" content="Upcoming Solo Exhibition | Dilara Altınkepçe Arslan">
    <meta property="og:description" content="Second solo exhibition coming soon. Curated by Nil Nuhoğlu. Exhibition Design by Aygen İncel.">
    <meta property="og:image" content="https://gh-kerimarslan.github.io/N-DilaraAltinkepceArslan/images/01-banner-daa-re-overcome-01.jpg">
    <meta property="og:url" content="https://gh-kerimarslan.github.io/N-DilaraAltinkepceArslan/">
    <meta property="og:type" content="website">

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Montserrat:wght@200;300;400;500&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #fafafa; color: #111; font-family: 'Montserrat', sans-serif; overflow-x: hidden; line-height: 1.8; }
        h1, h2, h3, h4 { font-family: 'Cormorant Garamond', serif; font-weight: 400; }
        a { text-decoration: none; color: inherit; transition: opacity 0.3s; }

        .page-hero { width: 100%; height: 60vh; position: relative; background: #111; display: flex; align-items: center; justify-content: center; color: #fff; }
        .hero-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, rgba(30,30,30,0.5) 0%, rgba(10,10,10,0.95) 100%); }
        .hero-title { position: relative; z-index: 2; text-align: center; padding: 0 20px; }
        .hero-title h4 { font-family: 'Montserrat', sans-serif; font-size: 0.8rem; letter-spacing: 5px; text-transform: uppercase; color: #aaa; margin-bottom: 20px; }
        .hero-title h1 { font-size: 4rem; letter-spacing: 6px; line-height: 1.1; color: #fff; }

        .content-container { max-width: 850px; margin: -50px auto 100px auto; padding: 60px 40px; position: relative; z-index: 3; background: #fff; box-shadow: 0 20px 40px rgba(0,0,0,0.06); text-align: center; }
        
        .credits-grid { display: flex; justify-content: center; gap: 40px; margin-bottom: 50px; border-bottom: 1px solid #eee; padding-bottom: 30px; flex-wrap: wrap; }
        .credit-item { text-align: center; }
        .credit-item label { font-family: 'Montserrat', sans-serif; font-size: 0.65rem; letter-spacing: 3px; text-transform: uppercase; color: #888; display: block; margin-bottom: 5px; }
        .credit-item span { font-size: 1.1rem; color: #111; font-weight: 500; }

        .teaser-text { font-family: 'Cormorant Garamond', serif; font-size: 1.5rem; font-style: italic; color: #333; line-height: 1.9; margin-bottom: 50px; }

        .announcement-footer { font-family: 'Montserrat', sans-serif; font-size: 0.75rem; letter-spacing: 4px; text-transform: uppercase; color: #888; border-top: 1px solid #eee; padding-top: 30px; }

        .back-nav { text-align: center; margin: 60px 0 100px 0; }
        .btn-outline { display: inline-block; padding: 12px 40px; border: 1px solid #111; font-size: 0.75rem; letter-spacing: 3px; text-transform: uppercase; transition: all 0.3s ease; }
        .btn-outline:hover { background: #111; color: #fff; }

        @media (max-width: 700px) {
            .hero-title h1 { font-size: 2.8rem; }
            .content-container { padding: 40px 20px; margin-top: -30px; }
            .credits-grid { flex-direction: column; gap: 20px; }
        }
    </style>
</head>
<body>

    <!-- DİNAMİK HEADER PLACEHOLDER -->
    <div id="header-placeholder"></div>

    <header class="page-hero">
        <div class="hero-overlay"></div>
        <div class="hero-title">
            <h4>Upcoming Solo Exhibition</h4>
            <h1>Second Solo Exhibition</h1>
        </div>
    </header>

    <main class="content-container">
        
        <div class="credits-grid">
            <div class="credit-item">
                <label>Artist</label>
                <span>Dilara Altınkepçe Arslan</span>
            </div>
            <div class="credit-item">
                <label>Curator</label>
                <span>Nil Nuhoğlu</span>
            </div>
            <div class="credit-item">
                <label>Exhibition Design</label>
                <span>Aygen İncel</span>
            </div>
        </div>

        <div class="teaser-text">
            "A new spatial inquiry expanding the boundaries of tactile memory, time's continuous echoes, and material presence."
        </div>

        <div class="announcement-footer">
            Full Exhibition Manifesto & Dates to be Announced
        </div>

    </main>

    <div class="back-nav">
        <a href="exhibitions.html" class="btn-outline">← Back to Exhibitions</a>
    </div>

    <!-- DİNAMİK FOOTER PLACEHOLDER -->
    <div id="footer-placeholder"></div>

    <!-- ORTAK SCRİPTLER -->
    <script>
        fetch('header.html')
            .then(response => response.text())
            .then(data => { document.getElementById('header-placeholder').innerHTML = data; });

        fetch('footer.html')
            .then(response => response.text())
            .then(data => { document.getElementById('footer-placeholder').innerHTML = data; });
    </script>

</body>
</html>
